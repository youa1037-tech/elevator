<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELEVATOR</title>
<meta name="description" content="엘리베이터 안내원 아케치와 10층에서 1층까지. 이상한 점이 보이면 비상벨을 누르십시오. 페르소나5 2차 창작 비공식 팬게임.">
<meta property="og:type" content="website">
<meta property="og:title" content="ELEVATOR">
<meta property="og:description" content="이상한 점이 보이면, 비상벨을 누르십시오. 페르소나5 2차 창작 비공식 팬게임.">
<meta property="og:image" content="https://youa1037-tech.github.io/elevator/og.png">
<meta property="og:url" content="https://youa1037-tech.github.io/elevator/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://youa1037-tech.github.io/elevator/og.png">
<meta name="theme-color" content="#000000">
<style>
/* VOICE: 조용하고 서늘한 접객 톤, 연옥의 엘리베이터
   IDEA: 낡은 호텔 엘리베이터 한 칸, 화면 = 엘리베이터 안, 360도로 둘러봄
   PICTURE: Blender 파노라마 + 3D 공간에 선 도트 아케치, 말풍선과 실물 패널
   COLOUR and TYPE: 검정·놋쇠 앰버, 위험은 붉은색 / Galmuri11 도트 폰트
   LAYOUT: 390×844 세로 무대를 화면에 맞춰 확대·축소 */
@font-face{font-family:'Galmuri11';src:url('assets/Galmuri11.woff2') format('woff2');font-display:swap}
:root{color-scheme:dark;--amber:#f2b84b;--red:#ff5a52}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#050507;overflow:hidden}
body{font-family:'Galmuri11',monospace;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:390px;height:844px;overflow:hidden;background:#000;flex:none;transform-origin:center}
#gl{position:absolute;inset:0;width:390px;height:844px;image-rendering:pixelated}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 60% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.65) 100%)}
#grain{position:absolute;inset:0;width:390px;height:844px;opacity:.6;mix-blend-mode:overlay;pointer-events:none}
#tap{position:absolute;inset:0;touch-action:none;cursor:grab}
#tap:active{cursor:grabbing}
#ind{position:absolute;display:flex;align-items:center;justify-content:center;color:var(--amber);text-shadow:0 0 8px rgba(242,184,75,.8);pointer-events:none;white-space:nowrap}
#ind.red{color:var(--red);text-shadow:0 0 8px rgba(255,90,80,.85)}
.hs{position:absolute;background:none;border:0;padding:0;cursor:pointer;border-radius:8px}
.hs:focus-visible{outline:2px solid var(--amber)}
#bclose.hot{box-shadow:0 0 0 2px rgba(255,210,122,.9),0 0 16px 4px rgba(255,210,122,.7);animation:pulse .5s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 2px rgba(255,210,122,1),0 0 24px 8px rgba(255,210,122,.95)}}
.box{position:absolute;left:18px;width:354px;padding:16px 18px 22px;background:#0c0c10;border:2px solid #fff;border-radius:16px;font-size:15px;line-height:1.65;white-space:pre-wrap}
#bubble{top:40px}
#bubble::after{content:'';position:absolute;left:var(--tail,92px);bottom:-11px;width:18px;height:18px;background:#0c0c10;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
#bubble.away::after{display:none}
#bubble.crack{border-radius:16px 13px 18px 11px;transform:rotate(-.8deg)}
#narr{top:40px;background:rgba(6,6,8,.9);border-color:#77787f;color:#cfd0d6}
#voice{top:250px;left:120px;width:240px;border-color:var(--red);color:#ffb3ad;background:rgba(20,4,6,.9)}
.next{position:absolute;right:14px;bottom:6px;font-size:11px;color:var(--amber);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#timer{margin-top:10px;height:4px;border-radius:2px;background:#3a1d20;overflow:hidden;display:none}
#timer i{display:block;height:100%;width:100%;background:var(--red)}
#hs-icm.ring::after{content:'';position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:#ff3b2f;box-shadow:0 0 10px #ff3b2f;animation:pulse .4s infinite alternate}
#choices{position:absolute;left:28px;right:28px;bottom:36px;display:flex;flex-direction:column;gap:10px}
#choices button{min-height:48px;padding:10px 16px;background:rgba(12,12,16,.92);border:2px solid #fff;border-radius:12px;color:#fff;font:15px/1.4 'Galmuri11',monospace;text-align:left;cursor:pointer}
#choices button:hover,#choices button:focus-visible{background:#26262e;outline:none}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:560px;max-width:340px;width:max-content;padding:8px 14px;border-radius:10px;background:rgba(0,0,0,.72);text-align:center;font-size:13px;line-height:1.5;color:#e6e6ea;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#stage.outside .hs,#stage.outside #ind{visibility:hidden!important}
#ind.melt{animation:melt 2.2s steps(11) infinite;color:#ff6a5a}
@keyframes melt{0%{transform:none;filter:none}35%{transform:skewX(9deg) scaleY(1.3) translateY(3px);filter:blur(.5px)}70%{transform:skewX(-7deg) scaleY(1.7) translateY(7px);filter:blur(1px)}100%{transform:scaleY(1.15) translateY(2px)}}
#insert{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:96px;pointer-events:none;background:radial-gradient(ellipse at 50% 34%,rgba(0,0,0,.55),rgba(0,0,0,.88) 70%);animation:fadein .6s ease-out}
#insert.hide{display:none}
#insert img{width:min(210px,54vw);image-rendering:pixelated;filter:drop-shadow(0 0 14px #000)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#rules.stain .paper{background-image:radial-gradient(ellipse 30px 19px at 86% 12%,rgba(110,70,30,.14),rgba(110,70,30,.07) 60%,transparent 72%)}
#rules.deep .paper{background-image:radial-gradient(ellipse 34px 22px at 86% 12%,rgba(110,70,30,.34),rgba(110,70,30,.18) 60%,transparent 72%)}
#choices button.urge{border-color:var(--amber);color:var(--amber);animation:urge 1.6s ease-in-out infinite}
@keyframes urge{50%{box-shadow:0 0 14px rgba(242,184,75,.45)}}
#stage .hs.press{animation:ring .28s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,236,190,.85)}100%{box-shadow:0 0 0 14px rgba(255,236,190,0)}}
#ind.blip{animation:indblip .35s ease-out}
@keyframes indblip{0%{filter:brightness(2.2)}100%{filter:none}}
#choices button{transition:transform .08s,background .15s}
#choices button.press,#choices button:active{transform:scale(.97);background:#2e2e38}
.turn:active{transform:scale(.94)}
#hs-ak{pointer-events:none}
#rbub{position:absolute;max-width:220px;padding:8px 12px;background:#0c0c10;border:2px solid #fff;border-radius:12px;font-size:13px;line-height:1.5;transform:translate(-50%,-100%);pointer-events:none;white-space:pre-wrap}
#rbub.far{transform:translate(-50%,0)}#rbub.far::after{display:none}
.lastrec{margin-top:8px;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:8px 10px}.lastrec summary{cursor:pointer;color:var(--amber)}.lastrec p{margin:8px 0 0;white-space:pre-wrap;word-break:keep-all;font-size:13px;line-height:1.8;color:#cfd0d6}
#rbub::after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:#0c0c10;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
#gl{filter:saturate(.92) contrast(1.04)}
#gl.mono{filter:grayscale(1) contrast(1.15)}
#stage.static #grain{opacity:1;mix-blend-mode:screen;animation:jit .12s steps(2) infinite}
#stage.static #gl{animation:tear .3s steps(3) infinite}
@keyframes tear{0%{transform:none;filter:contrast(1.4) brightness(1.15)}33%{transform:translateX(5px) skewX(-1.5deg)}66%{transform:translateX(-4px);filter:contrast(1.2) brightness(.85)}}
@keyframes jit{50%{transform:translate(-6px,3px)}}
#compass{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:11px;color:#8b8c94;letter-spacing:2px;pointer-events:none}
.turn{position:absolute;top:572px;width:40px;height:60px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);color:#fff;font:16px 'Galmuri11',monospace;cursor:pointer}
#turnL{left:0;border-left:0;border-radius:0 10px 10px 0}#turnR{right:0;border-right:0;border-radius:10px 0 0 10px}
.turn:focus-visible{outline:2px solid var(--amber)}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s}
#white{position:absolute;inset:0;background:#fbfbf8;opacity:0;pointer-events:none;transition:opacity 1.4s}
#whisper{position:absolute;left:24px;right:24px;top:42%;text-align:center;font-size:17px;letter-spacing:1px;color:#5a5b62;opacity:0;transition:opacity .9s;pointer-events:none}
#wcard{position:absolute;inset:0;z-index:40;background:#fbfbf8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;text-align:center;color:#2a2b30}
#wcard.hide{display:none}
#wcard p{margin:0;font-size:16px;line-height:1.9;opacity:0;transition:opacity 1.8s}
#wcard p.on{opacity:1}
#wcard p.cr{font-size:13px;color:#8b8c94}
#wcard p.big{font-size:22px;letter-spacing:4px;color:#b08a3a}
#flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .18s}
.full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px;background:#000}
#title.live{background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.6) 40%,rgba(0,0,0,.9) 75%)}
#stage.attract .turn,#stage.attract #compass{visibility:hidden}
#tind.rest{color:#f4efe0;text-shadow:0 0 8px rgba(255,240,210,.6);border-color:#4a4436}
#tind{font:400 14px Galmuri11,monospace;color:#ff8a3a;letter-spacing:3px;padding:4px 10px;background:#140a06;border:1px solid #3a2414;border-radius:4px;text-shadow:0 0 8px rgba(255,120,40,.8)}
#tlogo{cursor:default;user-select:none;-webkit-user-select:none}
.trow{display:flex;gap:10px}.trow .btn{flex:1}
.btn.small{min-height:40px;padding:6px 10px;font-size:13px}
.btn.hide,#tstart.hide{display:none}
#title .credit{position:absolute;bottom:28px;left:0;right:0}
#sheet{z-index:5}
#sheet .paper{width:100%;max-height:86%;overflow:auto;background:#16161b;border:2px solid #fff;border-radius:14px;padding:20px 18px;font-size:14px;line-height:1.6;color:#e6e6ea}
#sheet h3{margin:0 0 12px;font:400 16px Galmuri11,monospace;color:var(--amber)}
#sheet .btn{width:100%;margin-top:14px}
#sheet ol.notice{margin:0;padding-left:20px;font-size:13px;line-height:1.55}#sheet ol.notice li{margin:0 0 8px;word-break:keep-all}
#sheet #shclose{position:sticky;bottom:0;box-shadow:0 -10px 14px 4px #16161b}#sheet ol.notice b{color:var(--amber);font-weight:400}
.srow{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.srow>span{font-size:13px;color:#b9bac2}
.seg{display:flex;gap:6px}.seg button{flex:1;min-height:40px;background:#0c0c10;border:1px solid #55565e;border-radius:10px;color:#cfd0d6;font:13px Galmuri11,monospace;cursor:pointer}
.seg button.on{border-color:var(--amber);color:var(--amber);background:#221a0c}
.erow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #2a2a32}
.erow b{font-weight:400;color:var(--amber)}.erow.locked b{color:#55565e}.erow small{color:#8b8c94;text-align:right}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tgrid button{min-height:42px;background:#0c0c10;border:1px solid #55565e;border-radius:10px;color:#fff;font:13px Galmuri11,monospace;cursor:pointer}
#sheet select{width:100%;min-height:40px;background:#0c0c10;color:#fff;border:1px solid #55565e;border-radius:10px;font:13px Galmuri11,monospace;padding:0 8px}
#tbadge{display:none;position:absolute;top:26px;left:0;right:0;margin:auto;width:52px;text-align:center;font:10px Galmuri11,monospace;color:#000;background:#f2b84b;border-radius:4px;pointer-events:none;z-index:6}
#stage.testing #tbadge{display:block}
#end small{color:#8b8c94;font-size:12px;white-space:pre}
#end .ebtns{display:flex;flex-direction:column;gap:10px;width:240px}
#end.appear{animation:fadein 1.2s ease-out}
/* text FX adapted from animata.design (MIT): glitch ghosts, scramble-resolve, focus-blur, vertical tiles */
.glitch{display:inline-grid}
.glitch>span{grid-area:1/1}
.glitch .gbase{position:relative;z-index:2}
.glitch .ga,.glitch .gb{mix-blend-mode:screen;opacity:.9;pointer-events:none}
.glitch .ga{color:#cd2d37;animation:gA 2.6s infinite steps(1)}
.glitch .gb{color:#7fc4c4;animation:gB 2.6s infinite steps(1)}
@keyframes gA{0%,88%{transform:none}90%{transform:translate(-.1em,.03em)}92%{transform:translate(.08em,-.03em)}94%{transform:translate(-.03em,0)}96%{transform:translate(.02em,.01em)}100%{transform:none}}
@keyframes gB{0%,86%{transform:none}88%{transform:translate(.1em,-.03em)}91%{transform:translate(-.08em,.03em)}93%{transform:translate(.03em,0)}95%{transform:translate(-.02em,0)}100%{transform:none}}
#stage.calm .glitch .ga,#stage.calm .glitch .gb{animation:none;opacity:0}
#tiles{position:absolute;inset:0;z-index:20;pointer-events:auto;overflow:hidden}
#tiles i{position:absolute;top:0;height:100%;background:#0a0a0d;border-left:1px solid #17171c;will-change:transform}
#title h1{margin:0;font:400 40px 'Galmuri11',monospace;letter-spacing:6px;color:var(--amber);text-shadow:0 0 12px rgba(242,184,75,.6)}
#title p{margin:0;color:#8b8c94;font-size:13px}
#tmenu{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:240px}
#tmenu.hide{display:none}
#trec{margin:0 0 4px;color:#8b8c94;font-size:12px;text-align:center;line-height:1.7;white-space:pre-line}
.btn.ghost{border-color:#55565e;color:#b9bac2}
.btn.warn{border-color:#c0392b;color:#ff8a7a;font-size:13px}
#title .start{animation:blink 1.4s steps(2) infinite;color:#fff;font-size:15px}
#death{background:rgba(0,0,0,.92)}
#death h2{margin:0;color:var(--red);font:400 22px 'Galmuri11',monospace}
#death small{color:#8b8c94;font-size:13px}
.btn{min-height:48px;padding:10px 22px;background:#0c0c10;border:2px solid #fff;border-radius:12px;color:#fff;font:15px 'Galmuri11',monospace;cursor:pointer}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:24px}
#rules .paper{width:100%;background:#e8e0c6;border:4px solid #8a6d2f;color:#2a2418;padding:20px 18px;font-size:13px;line-height:1.75}
#rules h3{margin:0 0 10px;text-align:center;font:400 16px 'Galmuri11',monospace}
#rules ol{margin:0 0 16px;padding-left:22px}
#rules .btn{width:100%;background:#2a2418;border-color:#2a2418;color:#e8e0c6}
#note .paper{width:100%;background:#16161b;border:2px solid #fff;border-radius:14px;padding:20px 18px;font-size:14px;line-height:1.75;white-space:pre-wrap}
#note .btn{width:100%;margin-top:14px}
#end table{border-collapse:collapse;font-size:14px}
#end td{padding:6px 12px;border-bottom:1px solid #333}
#end td+td{text-align:right;color:var(--amber)}
.hide{display:none!important}
#silent{background:#000}
#sline{margin:0;font-size:18px;letter-spacing:4px;line-height:1.8;color:#e6e6ea}
#sound{top:8px;left:8px;right:auto;width:auto;height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.35);border-radius:10px;font-size:12px}
#check{top:8px;right:8px;left:auto;width:auto;height:34px;padding:0 12px;border:1px solid rgba(255,255,255,.35);border-radius:10px;font-size:12px}
#check.hot,#bbell.hot{box-shadow:0 0 0 2px rgba(255,210,122,.9),0 0 16px 4px rgba(255,210,122,.7);animation:pulse .5s infinite alternate}
#sexp{margin:0;max-width:300px;font-size:13px;line-height:1.7;color:var(--amber)}
#sfound{width:min(300px,86vw);text-align:left}
#sfound .dexh{margin:6px 0 4px;font-size:12px;color:#b9bac2;letter-spacing:1px}
#sfound ul{margin:0;padding:0 0 0 16px;max-height:120px;overflow:auto;font-size:12px;line-height:1.6;color:#e6e6ea}
#sfound b{font-weight:400;color:#000;background:var(--amber);border-radius:3px;padding:0 4px;font-size:10px}
#sfound .dexp{margin:8px 0 0;font-size:12px;color:var(--amber);text-align:center}
.sh4{margin:14px 0 4px;font:400 14px Galmuri11,monospace;color:#e6e6ea}
.dexnote{margin:0 0 6px;font-size:11px;color:#8b8c94}
.dexlist{margin:0;padding-left:22px;font-size:12px;line-height:1.65}
.dexlist .got{color:#e6e6ea}.dexlist .miss{color:#6c6d75}.dexlist .miss small{color:#a0503f}.dexlist .lock{color:#3a3b42}
#ssub{color:#6c6d75;font-size:12px;letter-spacing:1px}
#rules .hand{display:block;margin:2px 0 4px 6px;color:#24408e;font-size:12px;transform:rotate(-2deg)}
#rules .hand i{font-style:normal;color:#24408e}
#rules .hand img.jk{width:15px;height:20px;image-rendering:pixelated;vertical-align:-5px;margin-left:3px;transform:rotate(-12deg)}
#stage .hs.lit{box-shadow:none;background:radial-gradient(circle at 50% 50%,rgba(255,236,190,.95) 0 22%,rgba(255,176,84,.6) 38%,rgba(255,150,60,.18) 58%,transparent 72%);mix-blend-mode:screen}
#gl.flicker{animation:flick 2.3s infinite}
@keyframes flick{0%,100%{filter:none}44%{filter:none}45%{filter:brightness(.45)}47%{filter:none}79%{filter:none}80%{filter:brightness(.65)}82%{filter:none}}
#bubble.overflow #btext{white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="gl" width="390" height="844" aria-label="엘리베이터 안, 문 앞에 선 안내원 아케치"></canvas>
<div id="vig"></div>
<img id="grain" src="assets/grain.png" alt="">
<div id="tap"></div>
<div id="ind">13F</div>
<button class="hs" id="hs-ak" aria-label="아케치에게 말 걸기"></button>
<button class="hs" id="plaque" aria-label="탑승 수칙 읽기"></button>
<button class="hs" id="b1f" aria-label="1층 버튼"></button>
<button class="hs" id="bopen" aria-label="열림 버튼"></button>
<button class="hs" id="bclose" aria-label="닫힘 버튼"></button>
<button class="hs" id="bbell" aria-label="비상벨"></button>
<button class="hs" id="hs-scr" aria-label="벽의 자국 살펴보기"></button>
<button class="hs" id="hs-icm" aria-label="비상 통화 장치 살펴보기"></button>
<button class="hs" id="hs-cert" aria-label="안전검사 필증 살펴보기"></button>
<button class="turn" id="turnL" aria-label="왼쪽으로 돌아보기">◀</button>
<button class="turn" id="turnR" aria-label="오른쪽으로 돌아보기">▶</button>
<div id="compass">정면</div>
<button class="turn" id="sound" aria-label="설정 열기">설정</button>
<button class="turn" id="check" aria-label="점검표 보기">점검표</button>
<div id="flash"></div>
<div id="black"></div><div id="white"></div><div id="whisper"></div><div id="wcard" class="hide"></div>
<div id="insert" class="hide"><img src="assets/m2.png" alt="장갑을 벗은 손. 화약 그을음과 피멍, 그리고 픽셀이 뜯겨 나간 검은 구멍."></div>
<div class="box hide" id="narr"></div>
<div class="box hide" id="voice"></div>
<div class="box hide" id="bubble"><span id="btext"></span><div id="timer"><i></i></div></div>
<div id="choices"></div>
<div id="toast"></div>
<div id="rbub" class="hide"></div>
<div id="rules" class="modal hide"><div class="paper"><h3>탑승 수칙</h3><ol id="rlist"></ol><button class="btn" id="rclose">닫기</button></div></div>

</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $ = id => document.getElementById(id);
const stage = $('stage');
let stageScale = 1;
const fit = () => { stageScale = Math.min(innerWidth / 390, innerHeight / 844); stage.style.transform = `scale(${stageScale})`; renderer && renderer.setPixelRatio(Math.min(2, stageScale * devicePixelRatio)); };
let renderer = null;

// ===== 3D: panorama sphere + Akechi standing in the cabin =====
// Blender coords (camera at origin, forward +y, right +x, up +z) -> three (forward -x, right -z, up +y)
const T = (x, y, z) => new THREE.Vector3(-(y + 1.3), z - 1.45, -x);
renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: false });
renderer.setSize(390, 844, false);
fit(); addEventListener('resize', fit);
const scene3 = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(80, 390 / 844, 0.05, 200);
const loader = new THREE.TextureLoader();
const px = t => { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; return t; };
const tex = {};
const names = ['closed', 'studio', 'red', 'hall', 'lobby'];
let pending = 0;
const load = (key, url) => { pending++; tex[key] = px(loader.load(url, () => { if (--pending === 0) ready(); })); };
for (const n of names) { load('pano_' + n, `assets/pano_${n}.jpg`); tex['pano_' + n].wrapS = THREE.RepeatWrapping; }
load('ak', 'assets/m1.png');
load('shadow', 'assets/m3.png');
// Akechi sheets: 4 cells (base, breathe-up, blink, blink+up), 350px wide with a 2px gutter
// one atlas for every lighting of Akechi: 4 sheets per row, 2 cells each (base, breathe-up), 2px gutters
const AT_W = 2400, AT_H = 1258, CELL_W = 298, CELL_STEP = 300, CELL_H = 629;
const AK = { closed: [0, 0], hall: [1, 0], studio: [2, 0], red: [3, 0], lobby: [0, 1], mirror: [1, 1], exit: [2, 1] };
tex.ak.repeat.set(CELL_W / AT_W, CELL_H / AT_H);
let akSheet = 'closed';
// map-changing anomaly panoramas: loaded in the background, awaited only if needed
const MAPS = ['redwater', 'wall', 'void', 'flood', 'upside', 'mannequin', 'hands', 'plaqueflip', 'feet', 'green', 'tiles', 'darkceil', 'halfdoor', 'opposite', 'longhall', 'openend', 'person', 'person2', 'hole', 'goldframe', 'noscratch', 'blankplaque', 'extrabutton', 'nohandrail'];
const lazy = {};
const AKX = ['mirror', 'exit']; // basement scenes that bring their own Akechi sheet
function ensureScene(name) {
  const p = [ensureTex(name)];
  return Promise.all(p);
}
function preloadBasement() { for (const n of ['mirror', 'exit', 'outside']) ensureScene(n); new Image().src = 'assets/m2.png'; }
function ensureTex(name) {
  if (tex['pano_' + name]) return lazy[name] || Promise.resolve();
  lazy[name] = new Promise(r => { tex['pano_' + name] = px(loader.load(`assets/pano_${name}.jpg`, r, undefined, r)); tex['pano_' + name].wrapS = THREE.RepeatWrapping; });
  return lazy[name];
}

// door leaves for the opening/closing slide: cut from the closed panorama (leaf_tex.py) and placed at their Blender
// positions, clipped to the doorway so they vanish into the wall cavity as they slide
renderer.localClippingEnabled = true;
const clipDoor = [new THREE.Plane(new THREE.Vector3(0, 0, 1), 0.5), new THREE.Plane(new THREE.Vector3(0, 0, -1), 0.5)];
const leaves = ['L', 'R'].map(n => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.496, 2.1), new THREE.MeshBasicMaterial({ map: px(loader.load(`assets/leaf_${n}.png`)), clippingPlanes: clipDoor }));
  m.rotation.y = Math.PI / 2; m.visible = false; m.renderOrder = -2; scene3.add(m); return m;
});
const LEAF_OPEN = 0.47, LEAF_HALF = { halfdoor: 0.2 };
const NO_SLIDE = ['outside'];
function setLeaves(off) { leaves.forEach((m, i) => m.position.copy(T((i ? 1 : -1) * (0.25 + off), 1.235, 1.05))); }
function slideLeaves(from, to, ms) {
  leaves.forEach(m => { m.visible = true; });
  const t0 = performance.now();
  return new Promise(res => {
    const f = () => {
      const k = Math.min(1, (performance.now() - t0) / ms), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      setLeaves(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(f); else res();
    };
    f();
  });
}
const sphereGeo = new THREE.SphereGeometry(60, 64, 32); sphereGeo.scale(-1, 1, 1);
const sphere = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial());
scene3.add(sphere);

// camera-space basis of the original front shot (pitch -4 deg)
const P = -4 * Math.PI / 180;
const fwd = new THREE.Vector3(-Math.cos(P), Math.sin(P), 0);
const right = new THREE.Vector3(0, 0, -1);
const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
function billboard(d, xc, yc, w, h, map) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w * d, h * d), new THREE.MeshBasicMaterial({ map, transparent: true, depthWrite: false }));
  const pos = fwd.clone().multiplyScalar(d).add(right.clone().multiplyScalar(xc * d)).add(up.clone().multiplyScalar(yc * d));
  m.position.copy(pos);
  const back = fwd.clone().negate();
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right, up, back));
  scene3.add(m);
  return m;
}
const TAN = Math.tan(40 * Math.PI / 180);
const sx = x => (x - 195) / 195 * TAN * 390 / 844, sy = y => (422 - y) / 422 * TAN;
// Akechi: screen rect x -100..337, y 244..884 in the 390x844 front shot
// the sprite now runs down to the floor: 740 art rows where the original 512 spanned screen y 244..884
const AK_ROWS = 740, akUnitH = (sy(244) - sy(884)) * AK_ROWS / 512;
const akechi = billboard(1.0, (sx(-100) + sx(337)) / 2, sy(244) - akUnitH / 2, sx(337) - sx(-100), akUnitH, null);
const sw = (sx(337) - sx(-100)) * 1.04 * 430 / 350, sh = (sy(244) - sy(884)) * 1.04 * 592 / 512;
const shadow = billboard(2.45, (sx(-100) + sx(337)) / 2 + sx(211) , (sy(244) + sy(884)) / 2 + (sy(0) - sy(46)), sw, sh, null);
shadow.renderOrder = -1; akechi.renderOrder = 1;
const akBase = { pos: akechi.position.clone() };
const AKW = akechi.geometry.parameters.width, AKH = akechi.geometry.parameters.height;
let akRect = null, akHead = null, nudge = 0;
function placeAkechi() {
  akechi.updateMatrixWorld();
  const pt = (fx, fy) => { const v = akechi.localToWorld(new THREE.Vector3(fx * AKW, fy * AKH, 0)).project(cam); return { x: (v.x + 1) / 2 * 390, y: (1 - v.y) / 2 * 844, ok: v.z < 1 }; };
  const a = pt(-0.3, 0.46), b = pt(0.3, -0.5), hd = pt(0.02, 0.5);
  akRect = akechi.visible && a.ok && b.ok ? { l: Math.min(a.x, b.x), t: Math.min(a.y, b.y), r: Math.max(a.x, b.x), b: Math.max(a.y, b.y) } : null;
  akHead = hd.ok ? hd : null;
  const el = $('hs-ak');
  if (akRect && akRect.r > 0 && akRect.l < 390) Object.assign(el.style, { visibility: 'visible', left: akRect.l + 'px', top: akRect.t + 'px', width: (akRect.r - akRect.l) + 'px', height: (akRect.b - akRect.t) + 'px' });
  else el.style.visibility = 'hidden';
  const rb = $('rbub');
  if (!rb.classList.contains('hide') && !rb.classList.contains('far') && akHead && akRect) { rb.style.left = Math.max(120, Math.min(270, akHead.x)) + 'px'; rb.style.top = Math.max(akHead.y, akRect.t + (akRect.b - akRect.t) * 0.34) + 'px'; }
  animateAkechi(performance.now());
  if (nudge > 0) { nudge = Math.max(0, nudge - 0.08); const k = Math.sin(nudge * Math.PI); akechi.scale.set(akScale * (1 + 0.015 * k), akScale * (1 - 0.01 * k), 1); }
}

let yaw = 0, pitch = P, frontScene = 'closed';
const LIM = { min: -10 * Math.PI / 180, max: 22 * Math.PI / 180 };
function applyScene() {
  sphere.material.map = tex['pano_' + frontScene]; sphere.material.needsUpdate = true;
  akSheet = AK[frontScene] ? frontScene : 'hall';
  if (akechi.material.map !== tex.ak) { akechi.material.map = tex.ak; akechi.material.needsUpdate = true; }
  shadow.material.map = tex.shadow; shadow.visible = !NOSHADOW.includes(frontScene); shadow.material.needsUpdate = true;
  akechi.visible = frontScene !== 'outside'; stage.classList.toggle('outside', frontScene === 'outside');
}
const NOSHADOW = ['studio', 'mirror', 'exit', 'outside'];
function setAkSheet(key) { if (AK[key]) akSheet = key; }

// hotspots in Blender coords: corners (tl, br) or center for buttons
const D1 = 1.2, D0 = -2.4;
const HS = {
  plaque: [[0.63, D1 - 0.01, 1.803], [0.89, D1 - 0.01, 1.437]],
  b1f: [[0.69, 1.17, 1.23], [0.76, 1.17, 1.17]], bopen: [[0.69, 1.17, 1.087], [0.76, 1.17, 1.027]],
  bclose: [[0.69, 1.17, 0.944], [0.76, 1.17, 0.884]], bbell: [[0.69, 1.17, 0.8], [0.76, 1.17, 0.74]],
  ind: [[-0.21, D1 - 0.03, 2.46], [0.21, D1 - 0.03, 2.3]],
  'hs-cert': [[0.24, D0 + 0.02, 1.72], [-0.24, D0 + 0.02, 1.38]],
  'hs-scr': [[-1.09, -1.0, 1.6], [-1.09, -1.6, 1.2]],
  'hs-icm': [[1.08, -1.39, 1.47], [1.08, -1.21, 1.23]],
};
const v3 = new THREE.Vector3();
function project(x, y, z) {
  v3.copy(T(x, y, z)).project(cam);
  return { x: (v3.x + 1) / 2 * 390, y: (1 - v3.y) / 2 * 844, ok: v3.z < 1 };
}
function placeHotspots() {
  for (const [id, [a, b]] of Object.entries(HS)) {
    const el = $(id), p = project(...a), q = project(...b);
    const vis = p.ok && q.ok && Math.max(p.x, q.x) > 0 && Math.min(p.x, q.x) < 390;
    el.style.visibility = vis ? 'visible' : 'hidden';
    if (!vis) continue;
    let l = Math.min(p.x, q.x), t = Math.min(p.y, q.y), w = Math.abs(q.x - p.x), h = Math.abs(q.y - p.y);
    if (id !== 'ind') { const padW = Math.max(0, 44 - w) / 2, padH = Math.max(0, 26 - h) / 2; l -= padW; t -= padH; w += padW * 2; h += padH * 2; }
    Object.assign(el.style, { left: l + 'px', top: t + 'px', width: w + 'px', height: h + 'px' });
    if (id === 'ind') el.style.fontSize = Math.max(9, h * 0.5) + 'px';
  }
}

// ---- looking around
const VNAME = ['정면', '오른쪽', '뒤', '왼쪽'];
let arriveGrace = 0, canTurn = false, doorOpen = false, epoch = 0, lookedBack = false, turnAnim = null, tutorial = false, warnedBack = false;
const norm = a => Math.atan2(Math.sin(a), Math.cos(a));
function frame() {
  const dir = new THREE.Vector3(Math.cos(yaw) * Math.cos(pitch), Math.sin(pitch), Math.sin(yaw) * Math.cos(pitch));
  // yaw 0 faces front (-x); positive yaw turns right (-z)
  cam.position.set(0, 0, 0);
  cam.lookAt(-dir.x, dir.y, -dir.z);
  if (settleT && SET.shake) { const t = (performance.now() - settleT) / 420; if (t < 1) cam.rotateX(-0.014 * Math.sin(t * Math.PI) * (1 - t)); else settleT = 0; }
  if (A_ === 'tilt') cam.rotateZ(0.14);
  renderer.render(scene3, cam);
  placeHotspots(); placeAkechi();
  const y = norm(yaw), deg = y * 180 / Math.PI;
  const sector = Math.round(((deg % 360) + 360) % 360 / 90) % 4;
  $('compass').textContent = VNAME[sector];
  $('bubble').classList.toggle('away', Math.abs(deg) > 25);
  checkMoved(deg);
  if (Math.abs(deg) > 120) {
    if (doorOpen && canTurn && performance.now() > arriveGrace) turnedBack();
    else if (tutorial && frontScene === 'hall') { if (!warnedBack) { warnedBack = true; show('a', '손님, 문이 열려 있을 때 등을 돌리시는 건 좋지 않습니다. ……수칙 4번, 기억해 두세요.', { wait: false }); } }
    else if (frontScene === 'outside') { if (!lookedBack) { lookedBack = true; toast('불 꺼진 문이 닫혀 있다. ……아무것도 없다.'); } }
    else if (canTurn && !lookedBack) { lookedBack = true; toast('등 뒤에서 아케치의 시선이 느껴진다.'); }
  }
}
function loop() {
  if (camAnim) {
    const k = Math.min(1, (performance.now() - camAnim.t0) / camAnim.d), e = 1 - (1 - k) ** 3;
    yaw = camAnim.y0 + (camAnim.y1 - camAnim.y0) * e; pitch = camAnim.p0 + (camAnim.p1 - camAnim.p0) * e;
    cam.fov = camAnim.f0 + (camAnim.f1 - camAnim.f0) * e; cam.updateProjectionMatrix();
  }
  const now = performance.now(), dt = Math.min(0.05, (now - (loop.last || now)) / 1000); loop.last = now;
  if (titleOn) lookT.yaw += dt * 0.05;
  if (!turnAnim && !camAnim) { const ease = 1 - Math.exp(-dt * 16); yaw += (lookT.yaw - yaw) * ease; pitch += (lookT.pitch - pitch) * ease; }
  if (turnAnim) {
    const k = Math.min(1, (performance.now() - turnAnim.t0) / 350);
    const e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    yaw = turnAnim.from + (turnAnim.to - turnAnim.from) * e;
    if (k >= 1) turnAnim = null;
    lookT.yaw = yaw; lookT.pitch = pitch;
  }
  frame(); requestAnimationFrame(loop);
}
const modalOpen = () => ['rules', 'note', 'sheet'].some(id => !$(id).classList.contains('hide'));
function turnBy(d) { if (!canTurn || modalOpen()) return; turnAnim = { from: yaw, to: yaw + d * Math.PI / 2, t0: performance.now() }; }
const lookT = { yaw: 0, pitch: -4 * Math.PI / 180 };
function resetView() { turnAnim = null; yaw = 0; pitch = P; lookT.yaw = yaw; lookT.pitch = pitch; }
$('turnL').addEventListener('click', e => { e.stopPropagation(); turnBy(-1); });
$('turnR').addEventListener('click', e => { e.stopPropagation(); turnBy(1); });
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') turnBy(-1); else if (e.key === 'ArrowRight') turnBy(1); });

// drag to look, tap to advance
let drag = null;
$('tap').addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: lookT.yaw, pitch: lookT.pitch, moved: false }; $('tap').setPointerCapture(e.pointerId); });
$('tap').addEventListener('pointermove', e => {
  if (modalOpen()) { drag = null; return; }
  if (!drag) return;
  const dx = (e.clientX - drag.x) / stageScale, dy = (e.clientY - drag.y) / stageScale;
  if (Math.hypot(dx, dy) > 8) drag.moved = true;
  if (!drag.moved || !canTurn) return;
  turnAnim = null;
  lookT.yaw = drag.yaw - dx * 0.0045;
  lookT.pitch = Math.max(LIM.min, Math.min(LIM.max, drag.pitch + dy * 0.0035));
});
$('tap').addEventListener('pointerup', e => {
  if (drag && !drag.moved) {
    const r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / stageScale, y = (e.clientY - r.top) / stageScale;
    if (!tapWait && !typing && akRect && x > akRect.l && x < akRect.r && y > akRect.t && y < akRect.b) poke(); else advance();
  }
  drag = null;
});
$('tap').addEventListener('pointercancel', () => { drag = null; });

// ===== text & choices =====
let S = { mask: 3, interest: 0, sleeve: false };
let tapWait = null, typing = null, panelHook = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function hideBoxes() { for (const id of ['narr', 'voice', 'bubble']) $(id).classList.add('hide'); }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1800); }
function typeInto(el, text, speed = 32, voice = null) {
  return new Promise(res => {
    let i = 0; el.textContent = '';
    if (speed <= 0) { el.textContent = text; typing = null; res(); return; }
    const id = setInterval(() => { el.textContent = text.slice(0, ++i); if (voice && i % 2 === 0 && text[i - 1] !== ' ') SFX.blip(voice); if (i >= text.length) { clearInterval(id); typing = null; res(); } }, speed);
    typing = () => { clearInterval(id); el.textContent = text; typing = null; res(); };
  });
}
async function show(who, text, { wait = true, speed, voice } = {}) {
  hideBoxes();
  const box = who === 'a' ? $('bubble') : who === 'v' ? $('voice') : $('narr');
  box.classList.remove('hide');
  box.querySelector('.next')?.remove();
  await typeInto(who === 'a' ? $('btext') : box, text, speed ?? Math.round(32 * TEXT_MUL[SET.text]), voice || (who === 'a' ? (basement ? 'low' : 'akechi') : who === 'v' ? 'voice' : null));
  if (!wait) return;
  const n = document.createElement('div'); n.className = 'next'; n.textContent = '▼'; box.appendChild(n);
  await new Promise(r => tapWait = r);
  n.remove();
}
const A = t => show('a', t), N = t => show('n', t), V = t => show('v', t);
function advance() { if (typing) typing(); else if (tapWait) { const r = tapWait; tapWait = null; r(); } }
for (const id of ['narr', 'voice', 'bubble']) $(id).addEventListener('click', advance);
function choose(opts) {
  return new Promise(res => {
    const c = $('choices'); c.innerHTML = '';
    opts.forEach((t, i) => { const b = document.createElement('button'); b.textContent = '▶ ' + t; b.onclick = () => { SFX.button(); buzz(10); b.classList.add('press'); setTimeout(() => { c.innerHTML = ''; res(i); }, 90); }; c.appendChild(b); });
  });
}
async function swapScene(name) {
  await ensureScene(name);
  const opening = frontScene === 'closed' && name !== 'closed' && !NO_SLIDE.includes(name);
  const closing = frontScene !== 'closed' && name === 'closed' && !NO_SLIDE.includes(frontScene);
  if (opening || closing) {
    // the doors slide instead of a blink: open = new scene behind the leaves, then part them
    const lit = (opening ? name : frontScene) === 'red' ? 0xff7a7a : 0xffffff;
    leaves.forEach(m => m.material.color.set(lit));
    SFX.door();
    if (opening) {
      setLeaves(0); leaves.forEach(m => { m.visible = true; });
      frontScene = name; applyScene(); ambience(name);
      await slideLeaves(0, LEAF_HALF[name] ?? LEAF_OPEN, 950);
    } else {
      await slideLeaves(LEAF_HALF[frontScene] ?? LEAF_OPEN, 0, 850);
      frontScene = name; applyScene(); ambience(name);
    }
    leaves.forEach(m => { m.visible = false; });
    return;
  }
  if ((frontScene === 'closed') !== (name === 'closed')) SFX.door();
  $('flash').style.opacity = 1; await sleep(180); frontScene = name; applyScene(); ambience(name); $('flash').style.opacity = 0;
}
async function travel(floors) {
  hideBoxes(); if (frontScene !== 'closed') await swapScene('closed');
  SFX.loop('hum');
  for (const f of floors) { $('ind').textContent = '▼ ' + f; await sleep(650); }
  SFX.stop('hum', 0.6); SFX.ding(); settleT = performance.now(); buzz(18);
  // the ding turns you back to the door: reading the back wall between floors must not cost a life
  arriveGrace = performance.now() + 1200;
  const yy = norm(yaw);
  if (canTurn && Math.abs(yy) > Math.PI / 2) { turnAnim = { from: yaw, to: yaw - yy, t0: performance.now() }; toast('띵— 무심코 문 쪽으로 몸을 돌렸다.'); }
}
function setInd(t, red) { const el = $('ind'); el.textContent = t; el.classList.toggle('red', !!red); pulse(el, 'blip'); }
function pulse(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function shake() { if (!SET.shake) return; stage.animate([{ translate: '0 0' }, { translate: '-3px 0' }, { translate: '3px 0' }, { translate: '0 0' }], { duration: 350 }); }

// ---- persistent run state (survives resets within the session)
const G = { deaths: 0, slips: 0, sawCert: false, sawHand: false, sawScratch: false, handNoticed: false, lookedAway: false, escaped: false, escapeNudged: false, afterEnd: '', allGreeted: false, found: [], missed: [] };
// ---- save: one slot in localStorage. Browser storage can be missing or throw (private mode), so every access is guarded.
const SAVE_KEY = 'elevator.save.v1';
const SAVE = { stage: 'new', endings: [], muted: false };
function saveGame() {
  if (TEST) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, G, stage: SAVE.stage, endings: SAVE.endings, muted: SFX.muted, at: Date.now() })); } catch (e) {}
}
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!d || d.v !== 1) return false;
    for (const k of Object.keys(G)) if (typeof d.G?.[k] === typeof G[k]) G[k] = d.G[k];
    for (const k of ['found', 'missed']) G[k] = Array.isArray(G[k]) ? G[k].filter(x => typeof x === 'string') : [];
    SAVE.stage = ['tutorial', 'run', 'basement', 'final'].includes(d.stage) ? d.stage : 'new';
    SAVE.endings = Array.isArray(d.endings) ? d.endings.filter(x => typeof x === 'string') : [];
    SAVE.muted = !!d.muted;
    return SAVE.stage !== 'new' || SAVE.endings.length > 0;
  } catch (e) { return false; }
}
function wipeSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  Object.assign(G, { deaths: 0, slips: 0, sawCert: false, sawHand: false, sawScratch: false, handNoticed: false, lookedAway: false, escaped: false, escapeNudged: false, afterEnd: '', allGreeted: false, found: [], missed: [] });
  SAVE.stage = 'new'; SAVE.endings = [];
}

    <p style="margin:0 0 10px;color:#8b8c94;font-size:12px">여기서 건너뛰면 화면 위에 TEST 표시가 붙고, 이번 접속 동안은 진행·엔딩이 저장되지 않아요. 새로고침하면 원래 기록으로 돌아가요.</p>
    <div class="tgrid">
      <button data-j="tutorial">튜토리얼</button><button data-j="ten">10F 본 운행</button>
      <button data-j="real1">진짜 1F (단서 완료)</button><button data-j="b2">B2F 붉은 층</button>
      <button data-j="b5">B5F 거울 층</button><button data-j="bx">B??? 반전</button>
      <button data-j="final">최종 1F</button><button data-j="clues">단서 4개 채우기</button>
    </div>
    <div class="srow"><span>이상 현상 지정 → 9F</span><select id="tsel">${opts}</select><div class="tgrid"><button data-j="anom">이 이상 현상으로 9F</button><button data-j="normal9">정상 층으로 9F</button></div></div>`);
  const fill = () => Object.assign(G, { deaths: Math.max(3, G.deaths), slips: Math.max(3, G.slips), sawCert: true, sawHand: true, sawScratch: true, handNoticed: true });
  const J = {
    tutorial: () => prologue(),
    ten: () => floor(10),
    real1: () => { fill(); testReal = true; setInd('1F'); firstFloor(epoch); },
    b2: () => { fill(); callName(); },
    b5: () => { fill(); basement = true; bCheck = callName; preloadBasement(); floorB5(epoch); },
    bx: () => { fill(); basement = true; bCheck = callName; preloadBasement(); floorBX(epoch); },
    final: () => { fill(); finalFloor(); },
    anom: () => { testForce = $('tsel').value; floor(9); },
    normal9: () => { testForce = '__none__'; floor(9); },
  };
  for (const b of $('shbody').querySelectorAll('[data-j]')) b.onclick = () => {
    const j = b.dataset.j;
    if (j === 'clues') { fill(); testMark('fill-clues'); SFX.button(); toast('단서 4개와 게임오버 3회를 채웠다. (저장 안 됨)'); return; }
    testJump(j + (j === 'anom' ? ':' + $('tsel').value : ''), J[j]);
  };
}
$('again').addEventListener('click', () => tileWipe(() => { $('end').classList.add('hide'); A_ = null; resetAkechi(); resume(); }));
$('eback').addEventListener('click', () => { SFX.button(); tileWipe(() => showTitle(false)); });
}
